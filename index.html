<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Bible · First Prototype</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e7eaff}.app{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:100dvh}main{position:relative;min-height:320px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#182746,#090e1b 75%)}canvas{display:block;width:100%;height:100%;touch-action:none}aside{overflow:auto;border-left:1px solid #34405c;background:#11182b;padding:18px}.badge{font-size:12px;color:#93a9e5;letter-spacing:.12em;text-transform:uppercase}h1{font-size:23px;margin:8px 0 6px}h2{font-size:20px}p{line-height:1.55;color:#b7c4e1}.toolbar{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}.toolbar>*{pointer-events:auto}button,input{border:1px solid #42547c;border-radius:9px;background:#172440;color:#edf2ff;padding:9px 11px;font:inherit}button{cursor:pointer}button:hover{background:#25375a}input{width:180px;max-width:48vw}.hint{position:absolute;bottom:12px;left:15px;font-size:12px;color:#aab7d3;pointer-events:none}.card{border:1px solid #34405c;border-radius:12px;background:#17223a;padding:13px;margin:14px 0}.pill{display:inline-block;border-radius:20px;background:#293c60;color:#cddcff;font-size:12px;padding:5px 9px;margin:3px}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0;color:#b8c5df}.row strong{color:#f0f3ff}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}ul{padding-left:20px;line-height:1.8;color:#c3d1ec}.small{font-size:12px;color:#8da0c6} @media(max-width:700px){.app{grid-template-columns:1fr;grid-template-rows:minmax(320px,65dvh) minmax(240px,35dvh)}aside{border-left:0;border-top:1px solid #34405c}.toolbar{right:8px;left:8px;top:8px}button,input{padding:8px;font-size:13px}}

.toolbar{z-index:2}.toolbar input{width:160px} .actions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.actions button{flex:1;min-width:85px}.field{display:block;margin:12px 0;color:#c9d7f3;font-size:13px}.field input,.field textarea,.field select{display:block;width:100%;max-width:none;margin-top:5px;background:#0d162b;color:#fff;border:1px solid #45567c;border-radius:8px;padding:9px;font:inherit}.field textarea{min-height:92px;resize:vertical}.field input[type=color]{height:40px;padding:3px}.field input[type=range]{padding:0;accent-color:#9eafff}.muted{color:#9caccd;font-size:12px}.status{color:#a6f3c8;font-size:12px}.danger{border-color:#95546b;color:#ffd8e1}.item{display:flex;gap:7px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #30405f}.item button{padding:5px 8px}.fileInput{display:none} 
</style></head><body><div class="app"><main id="scene"><canvas id="graph" aria-label="Interactive concept graph"></canvas><div class="toolbar"><input id="search" placeholder="Search concepts…" aria-label="Search concepts"><button id="add">+ Concept</button><button id="reset">Reset view</button><button id="labels">Hide labels</button></div><div class="hint">Drag empty space to orbit · Scroll/pinch to zoom · Tap a node to inspect</div></main><aside><div class="badge">Interactive prototype · Step 2</div><h1>4D World Bible</h1><p class="muted">Edit concepts and relationships. Changes save automatically in this browser.</p><div class="actions"><button id="export">Export JSON</button><button id="import">Import JSON</button><input type="file" id="importFile" class="fileInput" accept=".json,application/json"></div><div class="status" id="status" role="status">Ready</div><div id="details"></div></aside></div><script>
const seedNodes=[
{id:'vael',name:'Emperor Vael',description:'Ruler of the empire, whose decisions reshape the continent.',tags:['Politics','History'],importance:95,color:'#ffc56b',p:[-1.2,.7,0]},
{id:'empire',name:'Vaelian Empire',description:'A sprawling realm built on trade, conquest, and ancient alliances.',tags:['Politics','Culture'],importance:90,color:'#f39a7b',p:[-3,.1,-.8]},
{id:'rift',name:'The Rift',description:'A mysterious magical rupture in the northern mountains.',tags:['Magic','Metaphysics'],importance:88,color:'#a78bfa',p:[1.3,1.7,-1]},
{id:'war',name:'Ancient War',description:'A conflict that shaped the present political order.',tags:['History','Warfare'],importance:84,color:'#ef7f99',p:[-.6,-1.4,-.8]},
{id:'council',name:'High Council',description:'The advisors and ministers responsible for imperial policy.',tags:['Politics'],importance:67,color:'#f9d784',p:[-2.5,1.9,1]},
{id:'forest',name:'Whispering Forest',description:'An old woodland whose trees remember forgotten eras.',tags:['Nature','Magic'],importance:70,color:'#6dd6a1',p:[3,.2,.2]},
{id:'order',name:'Order of Stars',description:'Scholars studying celestial patterns and forbidden magic.',tags:['Culture','Metaphysics'],importance:72,color:'#7cc9fa',p:[1.8,-1.3,1]},
{id:'relic',name:'Crown Relic',description:'An artifact said to bind the empire to its founding oath.',tags:['History','Magic'],importance:78,color:'#c3a2ff',p:[-.2,1.7,1.5]},
{id:'general',name:'General Arlen',description:'Commander of the imperial frontier forces.',tags:['Warfare','Politics'],importance:61,color:'#ff958a',p:[-2.2,-1.7,1.1]},
{id:'village',name:'Riverside Village',description:'A settlement where imperial customs meet forest traditions.',tags:['Culture','Nature'],importance:48,color:'#8ddcbe',p:[2.5,-1.5,-1.3]}
];
const seedLinks=[['vael','empire'],['vael','council'],['vael','general'],['vael','relic'],['empire','war'],['war','general'],['rift','forest'],['rift','order'],['rift','relic'],['forest','village'],['village','empire'],['order','relic'],['council','empire']];

const STORAGE_KEY='world-bible-step2-v1';
const clone=v=>JSON.parse(JSON.stringify(v));
let nodes=clone(seedNodes),links=seedLinks.map(([a,b])=>({a,b,type:'related'}));
function validWorld(d){return d&&Array.isArray(d.nodes)&&Array.isArray(d.links)&&d.nodes.length<=10000&&d.links.length<=30000&&d.nodes.every(n=>n&&typeof n.id==='string'&&n.id.length<150&&typeof n.name==='string'&&n.name.length<500&&typeof n.description==='string'&&n.description.length<100000&&Array.isArray(n.tags)&&n.tags.every(t=>typeof t==='string')&&typeof n.color==='string'&&/^#[0-9a-fA-F]{6}$/.test(n.color)&&Number.isFinite(n.importance)&&Array.isArray(n.p)&&n.p.length===3&&n.p.every(v=>Number.isFinite(v)))&&new Set(d.nodes.map(n=>n.id)).size===d.nodes.length&&d.links.every(l=>l&&typeof l.a==='string'&&typeof l.b==='string'&&typeof l.type==='string'&&l.type.length<100&&d.nodes.some(n=>n.id===l.a)&&d.nodes.some(n=>n.id===l.b)&&l.a!==l.b)}
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(validWorld(saved)){nodes=saved.nodes;links=saved.links}}catch(e){console.warn('Unable to restore saved world',e)}
const canvas=document.getElementById('graph'),ctx=canvas.getContext('2d'),scene=document.getElementById('scene');let w=1,h=1,dpr=1,yaw=.25,pitch=-.17,zoom=1,selected=nodes[0]?.id||null,showLabels=true,drag=false,lastX=0,lastY=0,moved=false,points=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s){$('status').textContent=s}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:2,nodes,links}));status('Saved locally ✓')}catch(e){status('Saving failed: export a backup');console.error(e)}}
function change(){save();details();draw()}
function resize(){let r=scene.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function project(p){let [x,y,z]=p;let xx=x*Math.cos(yaw)-z*Math.sin(yaw),zz=x*Math.sin(yaw)+z*Math.cos(yaw);let yy=y*Math.cos(pitch)-zz*Math.sin(pitch),depth=y*Math.sin(pitch)+zz*Math.cos(pitch);let perspective=4.5/(4.5+depth*.16);let scale=Math.min(w,h)*.125*zoom*perspective;return {x:w/2+xx*scale,y:h/2-yy*scale,depth,r:scale*.12}}
function draw(){ctx.clearRect(0,0,w,h);ctx.strokeStyle='#273452';ctx.lineWidth=1;for(let i=0;i<Math.max(w,h);i+=50){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(w,i);ctx.stroke()}const map=new Map(nodes.map(n=>[n.id,{...project(n.p),node:n}]));for(let {a,b} of links){let A=map.get(a),B=map.get(b);if(!A||!B)continue;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.strokeStyle=(a===selected||b===selected)?'#829ce0':'#435475';ctx.lineWidth=(a===selected||b===selected)?2.5:1.3;ctx.stroke()}points=[...map.values()].sort((a,b)=>b.depth-a.depth);let query=$('search').value.trim().toLowerCase();for(let pt of points){let n=pt.node,active=n.id===selected,match=!query||n.name.toLowerCase().includes(query)||n.tags.some(t=>t.toLowerCase().includes(query));let radius=Math.max(8,Math.min(18,pt.r*(.75+n.importance/140)));ctx.globalAlpha=match?1:.22;ctx.shadowColor=n.color;ctx.shadowBlur=active?28:12;ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(pt.x,pt.y,radius,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(active){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(pt.x,pt.y,radius+5,0,Math.PI*2);ctx.stroke()}if(showLabels){ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillStyle='#e8eeff';ctx.fillText(n.name,pt.x,pt.y-radius-12)}ctx.globalAlpha=1;pt.hitRadius=radius+9}}
function details(){let n=nodes.find(n=>n.id===selected);if(!n){$('details').innerHTML='<div class="card"><p>Select a concept or click + Concept to create one.</p></div>';return}let adjacent=links.filter(l=>l.a===n.id||l.b===n.id);let candidates=nodes.filter(other=>other.id!==n.id&&!adjacent.some(l=>l.a===other.id||l.b===other.id));$('details').innerHTML=`<div class="card"><h2><span class="dot" style="background:${n.color}"></span>${esc(n.name)}</h2><label class="field">Name<input id="editName" maxlength="500" value="${esc(n.name)}"></label><label class="field">Description<textarea id="editDesc">${esc(n.description)}</textarea></label><label class="field">Tags (comma separated)<input id="editTags" value="${esc(n.tags.join(', '))}"></label><label class="field">Importance: <span id="impValue">${n.importance}</span>/100<input id="editImportance" type="range" min="0" max="100" value="${n.importance}"></label><label class="field">Color<input id="editColor" type="color" value="${n.color}"></label><div class="row"><span>XYZ position</span><strong>${n.p.map(v=>v.toFixed(1)).join(', ')}</strong></div><div class="actions"><button id="duplicate">Duplicate</button><button class="danger" id="delete">Delete concept</button></div></div><div class="card"><strong>Relationships (${adjacent.length})</strong><div id="relationshipList">${adjacent.map(l=>{let other=nodes.find(x=>x.id===(l.a===n.id?l.b:l.a));return `<div class="item"><span>${esc(other?.name||'Unknown')} <small class="muted">(${esc(l.type)})</small></span><button data-unlink="${esc(l.a)}|${esc(l.b)}" aria-label="Remove relationship">×</button></div>`}).join('')||'<p class="muted">No relationships yet.</p>'}</div>${candidates.length?`<label class="field">Connect to<select id="connectTo"><option value="">Choose concept…</option>${candidates.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label><label class="field">Relationship type<input id="linkType" value="related" maxlength="100"></label><button id="connect">+ Add relationship</button>`:''}</div>`;
$('editName').addEventListener('change',e=>{n.name=e.target.value.trim()||'Untitled';change()});$('editDesc').addEventListener('change',e=>{n.description=e.target.value;change()});$('editTags').addEventListener('change',e=>{n.tags=e.target.value.split(',').map(x=>x.trim()).filter(Boolean);change()});$('editImportance').addEventListener('input',e=>{$('impValue').textContent=e.target.value;n.importance=+e.target.value;save();draw()});$('editColor').addEventListener('input',e=>{n.color=e.target.value;save();draw()});$('duplicate').onclick=()=>{let copy=clone(n);copy.id=crypto.randomUUID();copy.name+=' (copy)';copy.p=copy.p.map((v,i)=>v+(i===0?.5:0));nodes.push(copy);selected=copy.id;change()};$('delete').onclick=()=>{if(!confirm(`Delete "${n.name}" and its relationships?`))return;nodes=nodes.filter(x=>x.id!==n.id);links=links.filter(l=>l.a!==n.id&&l.b!==n.id);selected=nodes[0]?.id||null;change()};$('details').querySelectorAll('[data-unlink]').forEach(b=>b.onclick=()=>{let [a,c]=b.dataset.unlink.split('|');links=links.filter(l=>!(l.a===a&&l.b===c));change()});if($('connect'))$('connect').onclick=()=>{let target=$('connectTo').value;if(!target)return;links.push({a:n.id,b:target,type:$('linkType').value.trim()||'related'});change()};}
function pick(x,y){return [...points].reverse().find(p=>Math.hypot(x-p.x,y-p.y)<p.hitRadius)}canvas.addEventListener('pointerdown',e=>{drag=true;moved=false;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;yaw+=dx*.008;pitch=Math.max(-1.35,Math.min(1.35,pitch+dy*.008));lastX=e.clientX;lastY=e.clientY;draw()});canvas.addEventListener('pointerup',e=>{if(!moved){let r=canvas.getBoundingClientRect(),p=pick(e.clientX-r.left,e.clientY-r.top);if(p){selected=p.node.id;details();draw()}}drag=false});canvas.addEventListener('pointercancel',()=>drag=false);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.35,Math.min(3.5,zoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});let touchDistance=null;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){let a=e.touches[0],b=e.touches[1],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(touchDistance)zoom=Math.max(.35,Math.min(3.5,zoom*dist/touchDistance));touchDistance=dist;draw()}},{passive:true});canvas.addEventListener('touchend',()=>touchDistance=null);$('reset').onclick=()=>{yaw=.25;pitch=-.17;zoom=1;draw()};$('labels').onclick=e=>{showLabels=!showLabels;e.target.textContent=showLabels?'Hide labels':'Show labels';draw()};$('search').oninput=draw;
$('add').onclick=()=>{let id=crypto.randomUUID();nodes.push({id,name:'New Concept',description:'',tags:[],importance:50,color:'#79c9ff',p:[(Math.random()-.5)*3,(Math.random()-.5)*3,(Math.random()-.5)*3]});selected=id;change()};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:2,nodes,links},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='world-bible-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);status('Backup downloaded')};
$('import').onclick=()=>$('importFile').click();$('importFile').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('File is too large (5 MB limit)');let data=JSON.parse(await file.text());if(!validWorld(data))throw Error('Invalid World Bible JSON');if(!confirm(`Replace your current world with ${data.nodes.length} concepts and ${data.links.length} relationships? Export a backup first if needed.`))return;nodes=clone(data.nodes);links=clone(data.links);selected=nodes[0]?.id||null;change();status('World imported and saved')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}});
new ResizeObserver(resize).observe(scene);details();resize();
</script></body></html>
